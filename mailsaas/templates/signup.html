<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · MailSaaS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div class="auth-wrap"><div class="auth-card">
  <div class="logo">📨 Mail<span class="dot">SaaS</span></div>
  <p class="sub">Create your free workspace — 1,000 verifications included</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Full name</label>
    <input name="name" placeholder="Jane Doe" required autofocus>
    <label>Company / workspace</label>
    <input name="company" placeholder="Acme Inc.">
    <label>Work email</label>
    <input type="email" name="email" placeholder="you@company.com" required>
    <label>Password</label>
    <input type="password" name="password" placeholder="6+ characters" required>
    <div style="margin-top:18px"><button class="btn" style="width:100%">Create account</button></div>
  </form>
  <p class="small muted" style="margin-top:18px;text-align:center">
    Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
  </p>
</div></div>
</body></html>
