<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MailSaaS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div class="auth-wrap"><div class="auth-card">
  <div class="logo">📨 Mail<span class="dot">SaaS</span></div>
  <p class="sub">Sign in to your workspace</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Work email</label>
    <input type="email" name="email" placeholder="you@company.com" required autofocus>
    <label>Password</label>
    <input type="password" name="password" placeholder="••••••••" required>
    <div style="margin-top:18px"><button class="btn" style="width:100%">Sign in</button></div>
  </form>
  <p class="small muted" style="margin-top:18px;text-align:center">
    New here? <a href="{{ url_for('signup') }}">Create a free account</a>
  </p>
</div></div>
</body></html>
