<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor · MailSaaS</title>
<meta name="csrf-token" content="{{ csrf_token }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<div class="auth-wrap"><div class="auth-card">
  <div class="logo">🔒 Mail<span class="dot">SaaS</span></div>
  <p class="sub">Enter the 6-digit code from your authenticator app</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Authentication code</label>
    <input name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           placeholder="123456" required autofocus
           style="text-align:center;letter-spacing:.4em;font-size:1.3rem">
    <div style="margin-top:18px"><button class="btn" style="width:100%">Verify</button></div>
  </form>
  <p class="small muted" style="margin-top:18px;text-align:center">
    <a href="{{ url_for('login') }}">← Cancel</a></p>
</div></div>
</body></html>
