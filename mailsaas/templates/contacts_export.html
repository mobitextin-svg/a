{% extends "base.html" %}
{% block title %}Export Contacts{% endblock %}
{% block content %}
<h1>📤 Export Contacts</h1>
<p class="muted">Download your contacts as CSV or Excel. Optionally narrow the export
  to a single list or status.</p>

<div class="card">
  <h2>Choose what to export</h2>
  <form method="get" id="expForm">
    <div class="row" style="gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <label class="small">List</label>
        <select name="list">
          <option value="">All lists ({{ '{:,}'.format(total) }})</option>
          {% for l in lists %}<option value="{{ l.id }}" {{ 'selected' if list_filter==l.id|string }}>📋 {{ l.name }} ({{ l.n }})</option>{% endfor %}
        </select>
      </div>
      <div style="flex:1;min-width:220px">
        <label class="small">Status</label>
        <select name="status">
          <option value="">All statuses</option>
          <option value="active"       {{ 'selected' if status_filter=='active' }}>Active ({{ counts.get('active',0) }})</option>
          <option value="suppressed"   {{ 'selected' if status_filter=='suppressed' }}>Suppressed ({{ counts.get('suppressed',0) }})</option>
          <option value="unsubscribed" {{ 'selected' if status_filter=='unsubscribed' }}>Unsubscribed ({{ counts.get('unsubscribed',0) }})</option>
          <option value="bounced"      {{ 'selected' if status_filter=='bounced' }}>Bounced ({{ counts.get('bounced',0) }})</option>
        </select>
      </div>
    </div>

    <label class="small" style="margin-top:14px">Format</label>
    <div class="exp-formats">
      <button class="exp-card" name="download" value="csv" type="submit">
        <div class="ic">📄</div><b>CSV</b><div class="faint small">Universal, opens anywhere</div></button>
      <button class="exp-card" name="download" value="excel" type="submit">
        <div class="ic">📊</div><b>Excel</b><div class="faint small">Opens natively in Excel</div></button>
    </div>
  </form>
</div>

<style>
.exp-formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:6px}
.exp-card{border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;
  background:var(--panel2);color:var(--text);cursor:pointer;font:inherit}
.exp-card:hover{border-color:var(--accent);background:var(--panel)}
.exp-card .ic{font-size:1.8rem}
.exp-card b{display:block;margin-top:4px}
</style>
{% endblock %}
