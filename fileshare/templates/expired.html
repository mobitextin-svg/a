<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Link Expired</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a0f;color:#e8eaf2;font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#0e1118;border:1px solid #1e2535;border-radius:16px;padding:2.5rem;max-width:400px;width:100%;text-align:center}
.icon{font-size:3rem;margin-bottom:1rem}
h1{font-size:1.4rem;font-weight:800;margin-bottom:.75rem;color:#ff4757}
p{color:#6b7494;font-size:.9rem;line-height:1.6;margin-bottom:1rem}
a{color:#00d4ff;text-decoration:none;font-size:.88rem}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚫</div>
  <h1>Link Unavailable</h1>
  <p>{{ reason }}</p>
</div>
</body>
</html>
