{% extends "base.html" %}
{% block title %}FileShare — Change Password{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto">
  <h1 style="margin-bottom:.3rem">Change Password</h1>
  <p class="muted" style="font-size:.9rem;margin-bottom:2rem">Update your admin password.</p>

  {% if error %}<div class="alert alert-error">❌ {{ error }}</div>{% endif %}

  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="old_password" placeholder="Your current password" required autofocus>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="password" placeholder="Min 6 characters" required>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm" placeholder="Repeat new password" required>
      </div>
      <div style="display:flex;gap:10px;margin-top:1.25rem">
        <a href="/admin" class="btn btn-ghost" style="flex:1;justify-content:center">Cancel</a>
        <button type="submit" class="btn btn-primary" style="flex:2">✅ Update Password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
