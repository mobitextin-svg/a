<!--
  ══════════════════════════════════════════════════════════════════
  MODE SELECTION POPUP — paste this ANYWHERE inside <body> in admin.html
  (e.g. just before </body>)
  ══════════════════════════════════════════════════════════════════
-->

<!-- ── Modal overlay ─────────────────────────────────────────── -->
<div id="modeModal" style="display:none; position:fixed; inset:0; z-index:9999;
     background:rgba(0,0,0,.55); backdrop-filter:blur(4px);
     align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:16px; padding:36px 32px 28px;
              max-width:420px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.3);
              text-align:center; animation:modalIn .18s ease;">
    <div style="font-size:28px; margin-bottom:6px;">🔒</div>
    <h2 style="margin:0 0 6px; font-size:1.25rem; color:#111;">Select Download Mode</h2>
    <p style="margin:0 0 24px; color:#555; font-size:.9rem;">
      You must choose <strong>one mode</strong> before generating the link.
    </p>

    <!-- Single Device -->
    <div id="modeOptLocked" onclick="selectMode('locked')"
         style="border:2px solid #e0e0e0; border-radius:12px; padding:16px 20px;
                cursor:pointer; margin-bottom:12px; text-align:left;
                transition:all .15s; user-select:none;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:24px;">📱</span>
        <div>
          <div style="font-weight:700; color:#111; font-size:.95rem;">Single Device</div>
          <div style="color:#666; font-size:.82rem; margin-top:2px;">
            Locked to the first device that opens the link.<br>
            Other devices need admin approval.
          </div>
        </div>
        <span id="checkLocked" style="margin-left:auto; font-size:20px; display:none;">✅</span>
      </div>
    </div>

    <!-- Multi Device -->
    <div id="modeOptOpen" onclick="selectMode('open')"
         style="border:2px solid #e0e0e0; border-radius:12px; padding:16px 20px;
                cursor:pointer; margin-bottom:24px; text-align:left;
                transition:all .15s; user-select:none;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:24px;">🌐</span>
        <div>
          <div style="font-weight:700; color:#111; font-size:.95rem;">Multi Device</div>
          <div style="color:#666; font-size:.82rem; margin-top:2px;">
            Anyone with the link can download on any device.<br>
            No approval needed.
          </div>
        </div>
        <span id="checkOpen" style="margin-left:auto; font-size:20px; display:none;">✅</span>
      </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="cancelMode()"
              style="padding:10px 24px; border:2px solid #ddd; border-radius:8px;
                     background:#fff; cursor:pointer; font-size:.9rem; color:#555;">
        Cancel
      </button>
      <button id="modeConfirmBtn" onclick="confirmMode()" disabled
              style="padding:10px 28px; border:none; border-radius:8px;
                     background:#4f46e5; color:#fff; font-size:.9rem;
                     font-weight:600; cursor:pointer; opacity:.4;
                     transition:opacity .15s;">
        Generate Link →
      </button>
    </div>
  </div>
</div>

<style>
@keyframes modalIn {
  from { transform:scale(.92); opacity:0; }
  to   { transform:scale(1);   opacity:1; }
}
#modeOptLocked:hover, #modeOptOpen:hover { border-color:#4f46e5; background:#f8f7ff; }
.mode-selected { border-color:#4f46e5 !important; background:#f0eeff !important; }
</style>

<script>
/*
  ── HOW TO WIRE THIS UP ────────────────────────────────────────────
  Find the button in your admin.html that triggers the upload / generates
  the link.  Change its onclick (or the form submit handler) to call:

      openModeModal()

  instead of directly submitting.  The modal will call your real
  upload function once the user picks a mode.

  Set  window._realUploadFn  to point at your actual upload function
  (see bottom of this script).
  ──────────────────────────────────────────────────────────────────
*/

let _pendingMode = null;

function openModeModal() {
  // Reset state
  _pendingMode = null;
  ['Locked','Open'].forEach(k => {
    document.getElementById('modeOpt'+k).classList.remove('mode-selected');
    document.getElementById('check'+k).style.display = 'none';
  });
  document.getElementById('modeConfirmBtn').disabled = true;
  document.getElementById('modeConfirmBtn').style.opacity = '.4';
  document.getElementById('modeModal').style.display = 'flex';
}

function selectMode(mode) {
  _pendingMode = mode;
  // Visual feedback
  document.getElementById('modeOptLocked').classList.toggle('mode-selected', mode==='locked');
  document.getElementById('modeOptOpen').classList.toggle('mode-selected', mode==='open');
  document.getElementById('checkLocked').style.display = mode==='locked' ? 'inline' : 'none';
  document.getElementById('checkOpen').style.display   = mode==='open'   ? 'inline' : 'none';
  // Enable confirm
  const btn = document.getElementById('modeConfirmBtn');
  btn.disabled = false;
  btn.style.opacity = '1';
}

function cancelMode() {
  document.getElementById('modeModal').style.display = 'none';
  _pendingMode = null;
}

function confirmMode() {
  if (!_pendingMode) return;
  document.getElementById('modeModal').style.display = 'none';
  // ── Store selected mode into the hidden input ──────────────────
  const inp = document.getElementById('selectedModeInput');
  if (inp) inp.value = _pendingMode;
  // ── Then call your real upload/finalize function ───────────────
  if (typeof window._realUploadFn === 'function') {
    window._realUploadFn(_pendingMode);
  }
}

// Close on backdrop click
document.getElementById('modeModal').addEventListener('click', function(e){
  if (e.target === this) cancelMode();
});
</script>

<!--
  ── HIDDEN INPUT — add this inside your upload <form> or use it to
     pass mode to your JS upload handler ────────────────────────────
-->
<input type="hidden" id="selectedModeInput" name="mode" value="">

<!--
  ── INTEGRATION EXAMPLE ───────────────────────────────────────────
  In your existing upload JS, find the function that calls
  /admin/upload-finalize or /admin/upload-ajax (likely something like
  `startUpload()` or `finalizeUpload()`).

  BEFORE the change it probably reads:
      const mode = document.querySelector('input[name="mode"]:checked')?.value || 'locked';

  AFTER:
  1. Remove the default radio buttons / mode selector from the form HTML.
  2. Replace your upload-trigger button:
        <button onclick="startUpload()">Generate Link</button>
     with:
        <button onclick="openModeModal()">Generate Link</button>
  3. Set the real upload function:
        window._realUploadFn = function(mode) { startUpload(mode); };
  4. Update startUpload to accept mode as a parameter instead of
     reading it from the form.
  ──────────────────────────────────────────────────────────────────
-->
