name: MailSaaS CI

# Run the test suite on every push and pull request that touches the app.
on:
  push:
    paths:
      - "mailsaas/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "mailsaas/**"
      - ".github/workflows/ci.yml"

# A newer commit on the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            mailsaas/requirements.txt
            mailsaas/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mailsaas/requirements.txt
          pip install -r mailsaas/requirements-dev.txt

      - name: Run tests
        run: python -m pytest mailsaas/tests -q
